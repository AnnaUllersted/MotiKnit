<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload and Processing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .upload-container {
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .result-container {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: none;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .preview-container {
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .image-container {
            text-align: center;
        }
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            margin: 10px 0;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
            color: #666;
        }
        @media (max-width: 768px) {
            .image-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Image Upload and Processing</h1>
    
    <div class="upload-container">
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.gif">
            <button type="submit">Process Image</button>
        </form>
    </div>

    <div id="loading" class="loading">
        Processing image... Please wait...
    </div>

    <div class="image-grid">
        <div class="image-container">
            <h2>Original Image:</h2>
            <img id="originalImage" class="preview-image" alt="Original image">
        </div>
        <div class="image-container">
            <h2>Processed Image:</h2>
            <img id="processedImage" class="preview-image" alt="Processed image">
        </div>
    </div>

    <div id="result" class="result-container">
        <h2>Extracted Text:</h2>
        <pre id="extractedText"></pre>
    </div>

    <p id="error" class="error"></p>

    <script>
        const fileInput = document.getElementById('fileInput');
        const originalImage = document.getElementById('originalImage');
        const processedImage = document.getElementById('processedImage');
        const resultDiv = document.getElementById('result');
        const extractedTextElement = document.getElementById('extractedText');
        const errorElement = document.getElementById('error');
        const loadingElement = document.getElementById('loading');

        // Show original image preview when file is selected
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    originalImage.src = e.target.result;
                    originalImage.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!fileInput.files[0]) {
                errorElement.textContent = 'Please select a file';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            try {
                errorElement.textContent = '';
                resultDiv.style.display = 'none';
                loadingElement.style.display = 'block';
                
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Display processed image
                    processedImage.src = `data:image/png;base64,${data.processed_image}`;
                    processedImage.style.display = 'block';
                    
                    // Display extracted text
                    extractedTextElement.textContent = data.extracted_text;
                    resultDiv.style.display = 'block';
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                errorElement.textContent = error.message;
            } finally {
                loadingElement.style.display = 'none';
            }
        });
    </script>
</body>
</html>
