name: Deploy # The name of the workflow
on: 
  push:
    branches:
      - main #Launch the action on every push on the branch main  
jobs:
  build:
    runs-on: ubuntu-22.04 # Setup an environment to run the action
    steps:
      - uses: actions/checkout@v2 # This actions copy the repository on the environment
      - uses: akhileshns/heroku-deploy@v3.13.15 # This action deploys the content on Heroku
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}} #The Heroku api key we stored on our repo secret
          heroku_app_name: "motiknit" #The name of your heroku app - Must be unique in Heroku
          heroku_email: ${{secrets.HEROKU_EMAIL}} #The email of the Heroku account that owns the API key, stored as a repo secret
